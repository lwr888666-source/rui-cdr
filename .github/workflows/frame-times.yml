name: frame-times

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
      BASELINE: 2acce62e0be3c942506a941287397397e7b2ced0
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: frame-times
          cache-on-failure: true
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev libgtk-3-dev
      - name: Compare the previous release and Rui
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$BASELINE"
          git worktree add --detach "$RUNNER_TEMP/rui-baseline" "$BASELINE"
          mkdir -p "$RUNNER_TEMP/frame-times"
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          (
            cd "$RUNNER_TEMP/rui-baseline"
            cargo test --locked --release -- --ignored frame_times --nocapture --test-threads=1
          ) 2>&1 | tee "$RUNNER_TEMP/frame-times/before.log"
          # Worktrees share package names and versions. Clear our crates so
          # Cargo cannot reuse baseline metadata when its sources are newer
          # than the checkout. Third-party dependencies remain cached.
          cargo clean --release -p tracedraw-core -p tracedraw-cdr -p tracedraw-text -p tracedraw-render -p tracedraw-io -p tracedraw-vba -p tracedraw-vba-project
          cargo test --locked --release -- --ignored frame_times --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/frame-times/after.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frame-times
          path: ${{ runner.temp }}/frame-times/
          if-no-files-found: error
